<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>H-Runner – แข่งคิดเลข วิ่งเข้าเส้นชัย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,400;0,600;0,800;1,800;1,900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3ff; font-family: "Kanit", system-ui, sans-serif; color: #1e293b; user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  .hidden { display: none !important; }

  /* ---------- หน้าจอทั่วไป ---------- */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
  .panel { background: rgba(255,255,255,.93); border-radius: 26px; padding: 22px; width: min(92vw, 420px);
           box-shadow: 0 10px 0 rgba(15,40,90,.18), 0 20px 50px rgba(15,40,90,.35); border: 4px solid #fff; backdrop-filter: blur(6px); }
  label { display: block; font-weight: 600; font-size: 14px; color: #475569; margin: 4px 0 6px; }
  input { font-family: inherit; font-size: 18px; padding: 11px 14px; border-radius: 14px; border: 3px solid #cbd5e1; width: 100%;
          margin-bottom: 12px; outline: none; background: #f8fafc; color: #0f172a; }
  input:focus { border-color: #3b82f6; background: #fff; }
  .btn { font-family: inherit; font-size: 18px; font-weight: 800; padding: 12px 18px; border: 0; border-radius: 16px; cursor: pointer; width: 100%;
         color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.2); transition: transform .08s, box-shadow .08s; position: relative; top: 0; }
  .btn:active { top: 4px; box-shadow: none !important; }
  .btn:disabled { filter: grayscale(.8) brightness(1.1); cursor: default; }
  .btn.green { background: linear-gradient(#4ade80, #16a34a); box-shadow: 0 5px 0 #15803d; }
  .btn.blue { background: linear-gradient(#60a5fa, #2563eb); box-shadow: 0 5px 0 #1d4ed8; }
  .btn.ghost { background: #e2e8f0; color: #334155; text-shadow: none; box-shadow: 0 4px 0 #cbd5e1; font-size: 15px; padding: 10px; }
  .btn.big { font-size: 24px; padding: 14px; }
  .small { font-size: 13px; color: #64748b; text-align: center; }
  .row { display: flex; gap: 8px; margin-bottom: 12px; }

  /* ---------- หน้าแรก ---------- */
  #home { justify-content: flex-start; padding-top: max(3vh, 14px); }
  .logo { font-weight: 900; font-style: italic; font-size: clamp(58px, 15vw, 112px); line-height: .95; letter-spacing: -2px;
          transform: skewX(-6deg); filter: drop-shadow(0 6px 0 #1e3a8a) drop-shadow(0 12px 18px rgba(0,0,0,.35));
          position: relative; white-space: nowrap; animation: pop .7s cubic-bezier(.2,1.6,.4,1) both; }
  .logo span { -webkit-text-stroke: 6px #1e3a8a; paint-order: stroke fill; }
  .logo .h { background: linear-gradient(#fff36b, #ffb300 60%, #ff7a00); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo .dash { color: #fff; }
  .logo .run { background: linear-gradient(#ffffff, #bfe3ff 55%, #5ab0ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo::before { content: ""; position: absolute; left: -46px; top: 30%; width: 40px; height: 40%;
                  background: repeating-linear-gradient(180deg, #fff 0 6px, transparent 6px 14px); opacity: .85; border-radius: 4px; }
  .tagline { margin: 8px 0 14px; font-weight: 800; font-size: clamp(16px, 4.4vw, 22px); color: #fff; background: #ff6b35;
             padding: 4px 18px; border-radius: 999px; box-shadow: 0 4px 0 #c2410c; transform: rotate(-2deg); animation: pop .7s .15s both cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.4) rotate(-8deg); opacity: 0; } }
  .looks { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 14px; }
  .look { border: 3px solid transparent; border-radius: 14px; padding: 4px 0 2px; background: #f1f5f9; cursor: pointer; text-align: center; font-size: 10px; font-weight: 600; color: #475569; }
  .look.sel { border-color: #f59e0b; background: #fff7d6; transform: translateY(-2px); }
  .ava { width: 38px; height: 38px; margin: 0 auto 2px; border-radius: 50%; position: relative; border: 3px solid #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2); }
  .joinRow { display: flex; gap: 8px; margin-top: 12px; }
  .joinRow input { margin: 0; text-transform: uppercase; letter-spacing: 3px; text-align: center; font-weight: 800; }
  .joinRow .btn { width: 46%; }
  #status { min-height: 20px; margin-top: 10px; font-size: 14px; color: #dc2626; text-align: center; font-weight: 600; }
  .howto { display: flex; gap: 8px; margin-top: 14px; width: min(92vw, 560px); }
  .howto div { flex: 1; background: rgba(15,30,80,.55); color: #fff; border-radius: 16px; padding: 10px; font-size: 13px; text-align: center; line-height: 1.35; backdrop-filter: blur(4px); }
  .howto b { display: block; font-size: 22px; color: #fde047; }

  /* ---------- ล็อบบี้ ---------- */
  .code { font-size: 46px; font-weight: 900; letter-spacing: 10px; text-align: center; color: #f59e0b; -webkit-text-stroke: 2px #92400e; margin: -4px 0 8px; }
  .lobbyHead { display: flex; justify-content: space-between; margin: 14px 0 6px; }
  #lobbyList { list-style: none; padding: 0; margin: 0 0 12px; max-height: 34vh; overflow-y: auto; }
  #lobbyList li { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: #f1f5f9; border-radius: 12px; margin-bottom: 6px; font-weight: 600; }
  #lobbyList .ava { width: 30px; height: 30px; margin: 0; border-width: 2px; }

  /* ---------- HUD ---------- */
  #rankBox { position: absolute; left: 14px; top: 8px; pointer-events: none; }
  #rank { font-size: 64px; font-weight: 900; font-style: italic; color: #ffe14d; -webkit-text-stroke: 4px #7c2d12; paint-order: stroke fill;
          line-height: 1; text-shadow: 0 4px 0 #7c2d12; }
  #rank sup { font-size: 30px; }
  #roundInfo { color: #fff; font-weight: 800; font-size: 16px; text-shadow: 0 2px 3px #000; }
  #board { position: absolute; left: 10px; top: 104px; list-style: none; margin: 0; padding: 0; pointer-events: none; }
  #board li { display: flex; align-items: center; gap: 6px; background: rgba(15,23,42,.55); color: #fff; border-radius: 999px; padding: 3px 12px 3px 3px;
              margin-bottom: 5px; font-size: 13px; font-weight: 600; min-width: 150px; transition: transform .3s; }
  #board li.me { background: rgba(245,158,11,.9); color: #1e293b; }
  #board .ava { width: 24px; height: 24px; margin: 0; border-width: 2px; }
  #board .pts { margin-left: auto; font-weight: 800; }
  #board .ok { color: #4ade80; font-weight: 900; }
  #progress { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: min(90vw, 640px); display: flex; align-items: center; gap: 10px;
              color: #fff; font-weight: 800; font-size: 13px; text-shadow: 0 2px 3px #000; pointer-events: none; }
  #bar { flex: 1; height: 8px; background: rgba(255,255,255,.45); border-radius: 99px; position: relative; box-shadow: 0 2px 6px rgba(0,0,0,.3); }
  #dots div { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%,-50%); border: 2px solid #fff; }
  #dots div.me { width: 22px; height: 22px; border: 3px solid #fde047; z-index: 2; }

  /* ---------- กล่องโจทย์ ---------- */
  #qpanel { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); width: min(94vw, 560px); background: rgba(255,255,255,.95);
            border-radius: 24px; padding: 12px 14px 14px; box-shadow: 0 8px 0 rgba(15,40,90,.25), 0 16px 40px rgba(0,0,0,.35); border: 4px solid #fff; }
  #timer { height: 10px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
  #timerFill { height: 100%; width: 100%; background: linear-gradient(90deg, #22c55e, #facc15, #ef4444); background-size: 560px 100%; border-radius: 99px; }
  #qtext { text-align: center; font-size: clamp(38px, 10vw, 54px); font-weight: 900; margin: 4px 0 8px; color: #1e3a8a; letter-spacing: 1px; }
  #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ch { font-family: inherit; font-size: 30px; font-weight: 900; border: 0; border-radius: 16px; padding: 10px 0; color: #fff; cursor: pointer;
        text-shadow: 0 2px 0 rgba(0,0,0,.25); position: relative; top: 0; transition: opacity .2s, transform .15s; }
  .ch:active { top: 4px; box-shadow: none !important; }
  .ch small { position: absolute; left: 10px; top: 4px; font-size: 12px; opacity: .7; }
  .ch0 { background: #ef4444; box-shadow: 0 5px 0 #b91c1c; } .ch1 { background: #3b82f6; box-shadow: 0 5px 0 #1d4ed8; }
  .ch2 { background: #f59e0b; box-shadow: 0 5px 0 #b45309; } .ch3 { background: #22c55e; box-shadow: 0 5px 0 #15803d; }
  .ch:disabled { cursor: default; opacity: .4; }
  .ch.picked { opacity: 1; outline: 4px solid #1e293b; outline-offset: 2px; }
  .ch.right { opacity: 1; background: #16a34a; box-shadow: 0 5px 0 #14532d; transform: scale(1.04); }
  .ch.wrong { opacity: 1; background: #64748b; box-shadow: 0 5px 0 #334155; text-decoration: line-through; }
  #qmsg { text-align: center; font-weight: 800; font-size: 17px; margin-top: 10px; min-height: 24px; }
  #roundResult { position: absolute; top: 10px; right: 10px; background: rgba(15,23,42,.72); color: #fff; border-radius: 18px; padding: 10px 14px;
                 font-size: 14px; min-width: 190px; pointer-events: none; animation: slide .35s both; }
  #roundResult h4 { margin: 0 0 6px; color: #fde047; font-size: 15px; }
  #roundResult div { display: flex; gap: 8px; } #roundResult span:last-child { margin-left: auto; font-weight: 800; }
  @keyframes slide { from { transform: translateX(40px); opacity: 0; } }
  #big { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; font-size: 160px; font-weight: 900;
         font-style: italic; color: #ffe14d; -webkit-text-stroke: 6px #7c2d12; paint-order: stroke fill; text-shadow: 0 8px 0 #7c2d12; }

  /* ---------- ผลสุดท้าย ---------- */
  #final h2 { margin: 0 0 10px; text-align: center; font-size: 30px; color: #1e3a8a; }
  #podium { margin-bottom: 14px; }
  #podium .r { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 14px; background: #f1f5f9; margin-bottom: 6px; }
  #podium .r.me { background: #fff3c4; }
  #podium .m { font-size: 26px; width: 36px; text-align: center; font-weight: 900; }
  #podium .n { font-weight: 800; } #podium .d { font-size: 12px; color: #64748b; }
  #podium .p { margin-left: auto; font-weight: 900; font-size: 18px; color: #1e3a8a; }
  #final .btn + .btn { margin-top: 10px; }

  @media (max-height: 640px) {
    #qtext { font-size: 34px; margin: 0 0 6px; } .ch { font-size: 24px; padding: 6px 0; } #qpanel { bottom: 32px; padding: 8px 10px 10px; }
    #rank { font-size: 46px; } #board { top: 80px; } #board li { font-size: 12px; min-width: 120px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <!-- หน้าแรก -->
  <section id="home" class="screen">
    <div class="logo"><span class="h">H</span><span class="dash">-</span><span class="run">Runner</span></div>
    <div class="tagline">⚡ แข่งคิดเลข วิ่งเข้าเส้นชัย ⚡</div>
    <div class="panel">
      <label>ชื่อนักวิ่ง</label>
      <input id="nameInput" maxlength="12" placeholder="ใส่ชื่อของคุณ">
      <label>เลือกตัวละคร</label>
      <div id="looks" class="looks"></div>
      <button id="createBtn" class="btn green big">🏁 สร้างห้องใหม่</button>
      <div class="joinRow">
        <input id="codeInput" maxlength="5" placeholder="รหัสห้อง">
        <button id="joinBtn" class="btn blue">เข้าห้อง</button>
      </div>
      <div id="status"></div>
    </div>
    <div class="howto">
      <div><b>1</b>โจทย์ บวก ลบ คูณ หาร โผล่ขึ้นมา</div>
      <div><b>2</b>ตอบให้ถูก และไวที่สุด</div>
      <div><b>3</b>ยิ่งตอบไว ยิ่งวิ่งไกล ถึงเส้นชัยก่อนชนะ!</div>
    </div>
  </section>

  <!-- ล็อบบี้ -->
  <section id="lobby" class="screen hidden">
    <div class="panel">
      <div class="small">รหัสห้อง</div>
      <div id="roomCode" class="code"></div>
      <button id="copyBtn" class="btn ghost">📋 คัดลอกลิงก์เชิญเพื่อน</button>
      <div class="lobbyHead"><b>นักวิ่งในห้อง</b><span id="count" class="small"></span></div>
      <ul id="lobbyList"></ul>
      <div id="botRow" class="row"><button id="addBot" class="btn ghost">🤖 เพิ่มบอท</button><button id="removeBot" class="btn ghost">➖ ลบบอท</button></div>
      <button id="startBtn" class="btn green big">เริ่มแข่ง!</button>
      <div id="lobbyHint" class="small" style="margin-top:10px"></div>
    </div>
  </section>

  <!-- HUD ระหว่างแข่ง -->
  <div id="hud" class="hidden">
    <div id="rankBox"><div id="rank"></div><div id="roundInfo"></div></div>
    <ol id="board"></ol>
    <div id="progress"><span>START</span><div id="bar"><div id="dots"></div></div><span>GOAL 🏁</span></div>
  </div>
  <div id="qpanel" class="hidden">
    <div id="timer"><div id="timerFill"></div></div>
    <div id="qtext"></div>
    <div id="choices"></div>
    <div id="qmsg"></div>
  </div>
  <div id="roundResult" class="hidden"></div>
  <div id="big"></div>

  <!-- ผลสุดท้าย -->
  <section id="final" class="screen hidden">
    <div class="panel">
      <h2>🏆 ผลการแข่งขัน</h2>
      <div id="podium"></div>
      <button id="againBtn" class="btn green big">เล่นอีกครั้ง</button>
      <button id="leaveBtn" class="btn ghost">ออกจากห้อง</button>
    </div>
  </section>
</div>

<script type="module">
import * as THREE from 'three';

/* ======================================================================
   ค่าตั้งต้นของเกม
   ====================================================================== */
const PREFIX = 'h-runner-th-v1-';
const GOAL = 100;            // คะแนนที่ต้องสะสมถึงเส้นชัย (= 1 รอบสนาม)
const Q_TIME = 10000;        // เวลาตอบต่อข้อ (ms)
const REVEAL_TIME = 4500;    // เวลาโชว์ผล + วิ่ง (ms)
const MAX_ROUNDS = 15;
const POINTS = [16, 13, 11, 9, 8, 7, 6, 5]; // ระยะที่ได้ตามลำดับความไว (ตอบถูก)
const MAX_PLAYERS = 8;
const SKIN = '#ffd9b8';
const LOOKS = [
  { name: 'เปลวไฟ', shirt: '#ef4444', pants: '#1f2937', hair: '#7c2d12', style: 'spiky' },
  { name: 'ฟ้าใส',  shirt: '#3b82f6', pants: '#1e3a8a', hair: '#3f2a1d', style: 'cap', cap: '#facc15' },
  { name: 'ใบไม้',  shirt: '#22c55e', pants: '#14532d', hair: '#a16207', style: 'bob' },
  { name: 'ซันนี่', shirt: '#facc15', pants: '#7c3aed', hair: '#ea580c', style: 'pony' },
  { name: 'เมจิก',  shirt: '#a855f7', pants: '#312e81', hair: '#f472b6', style: 'pony' },
  { name: 'นินจา',  shirt: '#1f2937', pants: '#374151', hair: '#111827', style: 'band', band: '#ef4444' },
];
const BOT_NAMES = ['บอทจิ๋ว', 'บอทซิ่ง', 'บอทเลขเทพ', 'บอทงง', 'บอทไว', 'บอทชิล', 'บอทเก่ง'];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ava = i => { const l = LOOKS[i % LOOKS.length]; return `<span class="ava" style="background:linear-gradient(${l.hair} 0 38%, ${SKIN} 38% 70%, ${l.shirt} 70%)"></span>`; };
const ord = n => n + `<sup>${n === 1 ? 'st' : n === 2 ? 'nd' : n === 3 ? 'rd' : 'th'}</sup>`;
const medal = i => ['🥇', '🥈', '🥉'][i] || (i + 1);

/* ======================================================================
   ฉาก 3D
   ====================================================================== */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcdeeff, 120, 330);
const camera = new THREE.PerspectiveCamera(55, 1, 0.3, 1200);

const gradMap = new THREE.DataTexture(new Uint8Array([120, 190, 255]), 3, 1, THREE.RedFormat);
gradMap.minFilter = gradMap.magFilter = THREE.NearestFilter; gradMap.needsUpdate = true;
const matCache = {};
const toon = c => matCache[c] || (matCache[c] = new THREE.MeshToonMaterial({ color: c, gradientMap: gradMap }));
const flat = (c, extra = {}) => new THREE.MeshLambertMaterial({ color: c, ...extra });

function canvasTex(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}

// ท้องฟ้า
scene.add(new THREE.Mesh(new THREE.SphereGeometry(600, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color('#2b86ff') }, bot: { value: new THREE.Color('#dff4ff') } },
  vertexShader: 'varying vec3 vP; void main(){ vP = (modelMatrix*vec4(position,1.)).xyz; gl_Position = projectionMatrix*viewMatrix*vec4(vP,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bot; varying vec3 vP; void main(){ float h = clamp(normalize(vP).y*1.5+0.04,0.,1.); gl_FragColor = vec4(mix(bot,top,pow(h,0.75)),1.);\n#include <colorspace_fragment>\n}',
})));

// แสง
scene.add(new THREE.HemisphereLight(0xffffff, 0x5a9a3a, 1.35));
const sun = new THREE.DirectionalLight(0xfff3dd, 1.9);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 160 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);
const SUN_OFF = new THREE.Vector3(30, 60, 25);

/* ---------- สนามวงรี ---------- */
const L = 70, RIN = 26, LW = 1.7, LANES = 8, ROUT = RIN + LANES * LW;
const laneR = i => RIN + LW * (i + 0.5);

// จุดบนเส้นโค้งตามเซกเมนต์ (ใช้สร้างเมช)
function segPt(v, r) {
  const h = L / 2, k = Math.floor(v) % 4, t = v - Math.floor(v);
  if (k === 0) return [-h + L * t, r];
  if (k === 1) { const a = Math.PI * t; return [h + r * Math.sin(a), r * Math.cos(a)]; }
  if (k === 2) return [h - L * t, -r];
  const a = Math.PI * t; return [-h - r * Math.sin(a), -r * Math.cos(a)];
}
// ตำแหน่งตามสัดส่วนระยะทาง u (0 = เส้นสตาร์ท, 1 = เส้นชัย) บนลู่รัศมี r
function posAt(u, r) {
  const P = 2 * L + 2 * Math.PI * r;
  let s = (((u * P + L / 2) % P) + P) % P;
  const h = L / 2, arc = Math.PI * r;
  if (s < L) return [-h + s, r];
  s -= L; if (s < arc) { const a = s / r; return [h + r * Math.sin(a), r * Math.cos(a)]; }
  s -= arc; if (s < L) return [h - s, -r];
  s -= L; const a = s / r; return [-h - r * Math.sin(a), -r * Math.cos(a)];
}
function ringGeo(r1, r2, n = 60) {
  const pos = [], idx = [], N = 4 * n;
  for (let i = 0; i < N; i++) { const a = segPt(i / n, r1), b = segPt(i / n, r2); pos.push(a[0], 0, a[1], b[0], 0, b[1]); }
  for (let i = 0; i < N; i++) { const j = (i + 1) % N, a = 2 * i, b = a + 1, c = 2 * j, d = c + 1; idx.push(a, b, c, b, d, c); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals(); return g;
}
const stadiumDist = (x, z) => Math.hypot(Math.max(Math.abs(x) - L / 2, 0), z); // ระยะจากแกนกลางสนาม

function stripeTex(c1, c2) {

function makeRunner(lookIdx, name, isMe) {
  const lk = LOOKS[lookIdx % LOOKS.length];
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const add = (p, geo, c, x, y, z, shadow = true) => { const m = new THREE.Mesh(geo, toon(c)); m.position.set(x, y, z); m.castShadow = shadow; p.add(m); return m; };
  const legs = [], arms = [];
  for (const sd of [-1, 1]) {
    const hip = new THREE.Group(); hip.position.set(sd * 0.17, 0.98, 0); body.add(hip);
    add(hip, G.leg, SKIN, 0, -0.36, 0); add(hip, G.shoe, lk.shoe || '#f8fafc', 0, -0.8, 0.07); legs.push(hip);
    const sh = new THREE.Group(); sh.position.set(sd * 0.4, 1.62, 0); sh.rotation.z = sd * 0.15; body.add(sh);
    add(sh, G.arm, lk.shirt, 0, -0.24, 0); add(sh, G.hand, SKIN, 0, -0.52, 0); arms.push(sh);
  }
  const torso = add(body, G.torso, lk.shirt, 0, 1.4, 0); torso.scale.set(1.12, 1, 0.85);
  add(body, G.shorts, lk.pants, 0, 1.06, 0);
  const head = new THREE.Group(); head.position.set(0, 2.32, 0); body.add(head);
  add(head, G.head, SKIN, 0, 0, 0);
  for (const sd of [-1, 1]) {
    const e = add(head, G.eye, '#1e1b2e', sd * 0.2, 0.0, 0.52, false); e.scale.set(0.85, 1.3, 0.5);
    add(head, G.hl, '#ffffff', sd * 0.2 + 0.03, 0.05, 0.56, false);
    const ck = add(head, G.cheek, '#fda4af', sd * 0.32, -0.17, 0.45, false); ck.scale.set(1, 0.6, 0.4);
  }
  const mouth = add(head, G.mouth, '#7f1d1d', 0, -0.2, 0.54, false); mouth.rotation.z = Math.PI;
  const hairCap = add(head, G.cap, lk.hair, 0, 0.04, -0.03); hairCap.rotation.x = -0.32;
  if (lk.style === 'spiky') {
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2, s = add(head, G.spike, lk.hair, Math.sin(a) * 0.3, 0.5, Math.cos(a) * 0.3 - 0.12);
      s.rotation.set(Math.cos(a) * 0.7 - 0.3, 0, -Math.sin(a) * 0.7);

    add(head, G.spike, lk.hair, 0, 0.72, -0.1).rotation.x = -0.4;
  } else if (lk.style === 'cap') {
    const c = add(head, G.cap, lk.cap, 0, 0.1, -0.02); c.scale.setScalar(1.02); c.rotation.x = -0.2;
    const b = add(head, G.brim, lk.cap, 0, 0.26, 0.28); b.rotation.x = 0.12;
  } else if (lk.style === 'bob') {
    const b = add(head, G.bob, lk.hair, 0, 0.02, -0.05); b.rotation.x = -0.5;
  } else if (lk.style === 'pony') {
    add(head, G.ball, lk.hair, 0, 0.32, -0.6); const t = add(head, G.tail, lk.hair, 0, -0.08, -0.72); t.rotation.x = 0.35;
    add(head, G.hand, '#f43f5e', 0, 0.2, -0.66);
  } else if (lk.style === 'band') {
    const b = add(head, G.band, lk.band, 0, 0.16, 0); b.rotation.x = Math.PI / 2 - 0.25;
    for (const sd of [-1, 1]) { const t = add(head, G.tail, lk.band, sd * 0.12, 0.05, -0.75); t.scale.set(0.45, 0.8, 0.3); t.rotation.set(1.1, 0, sd * 0.4); }

  blob.rotation.x = -Math.PI / 2; blob.position.y = 0.08; root.add(blob);
  scene.add(root);
  return { root, body, legs, arms, head, phase: Math.random() * 6, u: 0, speed: 0, look: lookIdx, name, isMe };
}

function poseRunner(r, lane, dt, t, celebrate) {
  const rr = laneR(lane), [x, z] = posAt(r.u, rr), [x2, z2] = posAt(r.u + 0.002, rr);
  r.root.position.set(x, 0.07, z);
  r.root.rotation.y = Math.atan2(x2 - x, z2 - z);
  const ws = r.speed; // หน่วย/วินาที
  if (celebrate) {
    r.phase += dt * 7;
    r.body.position.y = Math.abs(Math.sin(r.phase)) * 0.7; r.body.rotation.x = 0;
    r.arms.forEach((a, i) => { a.rotation.x = Math.PI * 0.92 + Math.sin(r.phase * 2 + i) * 0.15; });
    r.legs.forEach((l, i) => { l.rotation.x = (i ? 1 : -1) * 0.2; });
    r.root.rotation.y += Math.PI / 2;
    return;
  }
  const running = ws > 0.6, amp = running ? Math.min(1, 0.45 + ws / 25) : 0.28;
  r.phase += dt * (running ? 8 + ws * 0.35 : 6);
  const s = Math.sin(r.phase);
  r.legs[0].rotation.x = s * amp * 1.1; r.legs[1].rotation.x = -s * amp * 1.1;
  r.arms[0].rotation.x = -s * amp * 1.2; r.arms[1].rotation.x = s * amp * 1.2;
  r.body.position.y = Math.abs(Math.cos(r.phase)) * 0.14 * amp;
  r.body.rotation.x = running ? 0.18 * amp : 0.03;
  r.head.rotation.z = Math.sin(r.phase * 0.5) * 0.05;
}

function genQ() {
  const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const op = ['+', '−', '×', '÷'][r(0, 3)]; let a, b, ans;
  if (op === '+') { a = r(2, 50); b = r(2, 50); ans = a + b; }
  else if (op === '−') { a = r(10, 99); b = r(1, a - 1); ans = a - b; }
  else if (op === '×') { a = r(2, 12); b = r(2, 12); ans = a * b; }
  else { b = r(2, 12); ans = r(2, 12); a = b * ans; }
  const set = new Set([ans]);
  while (set.size < 4) { const d = r(1, Math.max(4, Math.round(ans * 0.2))) * (Math.random() < .5 ? -1 : 1); if (ans + d >= 0) set.add(ans + d); }
  const choices = [...set].sort(() => Math.random() - .5);
  return { id: Math.random().toString(36).slice(2, 9), text: `${a} ${op} ${b}`, choices, answer: ans };
}

    q: H.q ? { id: H.q.id, text: H.q.text, choices: H.q.choices, answer: reveal ? H.q.answer : null } : null,
    results: H.state === 'reveal' ? H.results : null, final: H.state === 'finished' ? H.final : null,
    players: [...H.players.entries()].map(([id, p]) => ({ id, name: p.name, look: p.look, lane: p.lane, points: p.points, gain: p.gain,

  };
}

    const delay = 1500 + Math.random() * 6500, ok = Math.random() < 0.72, qid = H.q.id;
    const wrong = H.q.choices.filter(c => c !== H.q.answer);
    later(() => handleAction({ id, type: 'answer', qid, choice: ok ? H.q.answer : wrong[(Math.random() * wrong.length) | 0], time: delay }), delay);
  }
  H.dirty = true;
}
function endQuestion() {
  if (H.state !== 'question') return;
  clearTimers();
  const list = [...H.players.keys()].map(id => {
    const a = H.answers.get(id);
    return { id, choice: a ? a.choice : null, time: a ? a.time : null, correct: !!a && a.choice === H.q.answer };
  });
  const rightOnes = list.filter(x => x.correct).sort((a, b) => a.time - b.time);
  rightOnes.forEach((x, i) => { x.rank = i + 1; x.gain = POINTS[i] ?? POINTS[POINTS.length - 1]; });
  for (const x of list) {
    const p = H.players.get(x.id); x.gain = x.gain || 0; p.gain = x.gain; p.points += x.gain;
    if (x.correct) { p.correct++; p.ctime += x.time; }
  }
  list.sort((a, b) => (b.gain - a.gain) || ((a.time ?? 1e9) - (b.time ?? 1e9)));
  H.results = list; H.state = 'reveal'; H.endsAt = Date.now() + REVEAL_TIME; H.dirty = true;
  later(() => {
    const done = [...H.players.values()].some(p => p.points >= GOAL) || H.round >= MAX_ROUNDS;
    if (done) {
      H.final = [...H.players.entries()].map(([id, p]) => ({ id, name: p.name, look: p.look, points: p.points, correct: p.correct, ctime: p.ctime }))
        .sort((a, b) => (b.points - a.points) || (a.ctime - b.ctime));
      H.state = 'finished'; H.dirty = true;
    } else nextQuestion();
  }, REVEAL_TIME);
}
function handleAction(a) {
  const p = H.players.get(a.id);
  switch (a.type) {
    case 'join': {
      const name = String(a.name || 'นักวิ่ง').trim().slice(0, 12) || 'นักวิ่ง', look = Math.abs(+a.look || 0) % LOOKS.length;
      if (p) { p.name = name; p.look = look; }
      else {
        if (H.players.size >= MAX_PLAYERS) { const c = H.conns.get(a.id); if (c) { try { c.send({ error: 'full' }); } catch {} } return; }
        H.players.set(a.id, { name, look, lane: freeLane(), points: 0, gain: 0, correct: 0, ctime: 0 });
      }
      break;
    }
    case 'addBot': {
      if (a.id !== 'host' || H.state !== 'lobby' || H.players.size >= MAX_PLAYERS) return;
      const n = [...H.players.values()].filter(x => x.bot).length;
      H.players.set('bot-' + Math.random().toString(36).slice(2, 7), { name: BOT_NAMES[n % BOT_NAMES.length], look: (n + 1 + myLook) % LOOKS.length, lane: freeLane(), points: 0, gain: 0, correct: 0, ctime: 0, bot: true });
      break;
    }
    case 'removeBot': {
      if (a.id !== 'host' || H.state !== 'lobby') return;
      const bots = [...H.players.entries()].filter(([, x]) => x.bot); if (!bots.length) return;
      H.players.delete(bots[bots.length - 1][0]); break;
    }
    case 'start':
      if (!p || !(H.state === 'lobby' || H.state === 'finished')) return;
      clearTimers();
      for (const q of H.players.values()) Object.assign(q, { points: 0, gain: 0, correct: 0, ctime: 0 });
      H.round = 0; H.q = null; H.results = null; H.answers.clear();
      H.state = 'countdown'; H.endsAt = Date.now() + 3200;
      later(nextQuestion, 3200);
      break;
    case 'answer': {
      if (!p || H.state !== 'question' || !H.q || a.qid !== H.q.id || H.answers.has(a.id)) return;
      H.answers.set(a.id, { choice: +a.choice, time: Math.max(0, Math.min(Q_TIME, +a.time || Q_TIME)) });
      if (H.answers.size >= H.players.size) { clearTimers(); later(endQuestion, 500); }
      break;
    }
    case 'lobby':
      if (H.state !== 'finished') return;
      clearTimers();
      for (const q of H.players.values()) Object.assign(q, { points: 0, gain: 0, correct: 0, ctime: 0 });
      H.state = 'lobby'; H.round = 0; H.q = null; H.final = null;
      break;
    default: return;
  }
  H.dirty = true;
}
function removePlayer(id) {
  H.conns.delete(id); if (!H.players.delete(id)) return;
  H.answers.delete(id);
  if (H.state === 'question' && H.players.size && H.answers.size >= H.players.size) { clearTimers(); later(endQuestion, 300); }
  H.dirty = true;
}

/* ======================================================================
   เครือข่าย
   ====================================================================== */
const status = t => { $('#status').textContent = t; };
const lockBtns = on => { $('#createBtn').disabled = $('#joinBtn').disabled = on; };
const myName = () => { const n = $('#nameInput').value.trim() || 'นักวิ่ง'; localStorage.hrName = n; return n; };

function createRoom(tries = 0) {
  if (typeof Peer === 'undefined') return status('โหลดระบบเชื่อมต่อไม่ได้ ลองรีเฟรช');
  lockBtns(true); status('');
  roomCode = Array.from({ length: 5 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[(Math.random() * 31) | 0]).join('');
  peer = new Peer(PREFIX + roomCode);
  peer.on('open', () => {
    isHost = true; myId = 'host';
    handleAction({ id: myId, type: 'join', name: myName(), look: myLook });
    history.replaceState(null, '', '?room=' + roomCode); broadcast();
  });
  peer.on('connection', conn => {
    conn.on('open', () => { H.conns.set(conn.peer, conn); conn.send(snapshot()); });
    conn.on('data', a => { if (a && typeof a === 'object' && a.type !== 'addBot' && a.type !== 'removeBot') { a.id = conn.peer; handleAction(a); } });
    conn.on('close', () => removePlayer(conn.peer));
    conn.on('error', () => removePlayer(conn.peer));
  });
  peer.on('error', e => {
    if (e.type === 'unavailable-id' && tries < 3) { peer.destroy(); return createRoom(tries + 1); }
    if (!isHost) { lockBtns(false); status('สร้างห้องไม่สำเร็จ (' + e.type + ')'); }
  });
}
function joinRoom() {
  if (typeof Peer === 'undefined') return status('โหลดระบบเชื่อมต่อไม่ได้ ลองรีเฟรช');
  const code = $('#codeInput').value.trim().toUpperCase();
  if (code.length !== 5) return status('ใส่รหัสห้อง 5 ตัว');
  lockBtns(true); status('กำลังเข้าห้อง ' + code + ' ...'); roomCode = code;
  peer = new Peer();
  peer.on('open', id => {
    myId = id;
    hostConn = peer.connect(PREFIX + code, { reliable: true });
    hostConn.on('open', () => hostConn.send({ type: 'join', name: myName(), look: myLook }));
    hostConn.on('data', d => { if (d && d.error === 'full') { lockBtns(false); status('ห้องเต็มแล้ว (สูงสุด 8 คน)'); } else if (d && d.players) { status(''); applyState(d); } });
    hostConn.on('close', () => { S = null; render(); lockBtns(false); status('เจ้าของห้องออกไปแล้ว ห้องถูกปิด'); });
  });
  peer.on('error', e => {
    lockBtns(false);
    status(e.type === 'peer-unavailable' ? `ไม่พบห้อง ${code} (เจ้าของห้องอาจปิดหน้าเว็บไปแล้ว)` : 'เชื่อมต่อไม่ได้ (' + e.type + ')');
  });
  setTimeout(() => { if (!S && !isHost && $('#status').textContent.startsWith('กำลัง')) { lockBtns(false); status('เชื่อมต่อนานเกินไป ลองใหม่ หรือเปลี่ยนเครือข่าย'); } }, 15000);
}
function send(type, extra = {}) {
  if (isHost) handleAction({ id: myId, type, ...extra });
  else if (hostConn && hostConn.open) hostConn.send({ type, ...extra });
}

/* ======================================================================
   UI
   ====================================================================== */
$('#nameInput').value = localStorage.hrName || '';
const urlRoom = new URLSearchParams(location.search).get('room');
if (urlRoom) $('#codeInput').value = urlRoom.toUpperCase().slice(0, 5);
$('#looks').innerHTML = LOOKS.map((l, i) => `<div class="look${i === myLook ? ' sel' : ''}" data-i="${i}">${ava(i)}${l.name}</div>`).join('');
$('#looks').onclick = e => {
  const el = e.target.closest('.look'); if (!el) return;
  myLook = +el.dataset.i; localStorage.hrLook = myLook;
  document.querySelectorAll('.look').forEach(x => x.classList.toggle('sel', x === el));
  showcaseLook(myLook);
};
$('#createBtn').onclick = () => createRoom();
$('#joinBtn').onclick = joinRoom;
$('#codeInput').onkeydown = e => { if (e.key === 'Enter') joinRoom(); };
$('#startBtn').onclick = () => send('start');
$('#addBot').onclick = () => send('addBot');
$('#removeBot').onclick = () => send('removeBot');
$('#againBtn').onclick = () => send('lobby');
$('#leaveBtn').onclick = () => { location.href = location.pathname; };
$('#copyBtn').onclick = async () => {
  const link = location.origin + location.pathname + '?room=' + roomCode;
  try { await navigator.clipboard.writeText(link); $('#copyBtn').textContent = '✅ คัดลอกแล้ว ส่งให้เพื่อนได้เลย!'; } catch { prompt('คัดลอกลิงก์นี้:', link); }
  setTimeout(() => $('#copyBtn').textContent = '📋 คัดลอกลิงก์เชิญเพื่อน', 1800);
};
addEventListener('beforeunload', e => { if (isHost && H.conns.size) { e.preventDefault(); e.returnValue = ''; } });

function choose(i) {
  if (!S || S.state !== 'question' || !S.q || myAnswer) return;
  const me = S.players.find(p => p.id === myId); if (!me) return;
  myAnswer = { qid: S.q.id, choice: S.q.choices[i], idx: i };
  send('answer', { qid: S.q.id, choice: S.q.choices[i], time: performance.now() - qRecv });
  renderQuestion();
}
$('#choices').addEventListener('pointerdown', e => { const b = e.target.closest('.ch'); if (b) { e.preventDefault(); choose(+b.dataset.i); } });
addEventListener('keydown', e => { if (document.activeElement.tagName === 'INPUT') return; const k = '1234'.indexOf(e.key); if (k >= 0) choose(k); });

function applyState(snap) {
  const prevState = S && S.state;
  S = snap; clockOffset = snap.now - Date.now();
  if (S.state === 'question' && S.q && S.q.id !== lastQid) { lastQid = S.q.id; qRecv = performance.now(); myAnswer = null; }
  if (prevState !== S.state && S.state === 'countdown') { myAnswer = null; lastQid = null; }
  render();
}

const show = (sel, on) => $(sel).classList.toggle('hidden', !on);
function standings() { return [...S.players].sort((a, b) => (b.points - a.points) || (a.ctime - b.ctime)); }

function render() {
  const inRoom = !!(S && S.players.some(p => p.id === myId));
  const st = inRoom ? S.state : null;
  show('#home', !inRoom);
  show('#lobby', st === 'lobby');
  show('#hud', st === 'countdown' || st === 'question' || st === 'reveal');
  show('#qpanel', st === 'question' || st === 'reveal');
  show('#roundResult', st === 'reveal');
  show('#final', st === 'finished');
  if (!inRoom) { syncRunners([]); return; }
  syncRunners(S.players);

  if (st === 'lobby') {
    $('#roomCode').textContent = roomCode;
    $('#count').textContent = `${S.players.length}/${MAX_PLAYERS} คน`;
    $('#lobbyList').innerHTML = S.players.map(p => `<li>${ava(p.look)}${esc(p.name)}${p.id === myId ? ' <span class="small">(คุณ)</span>' : ''}${p.id === 'host' ? ' 👑' : ''}${p.bot ? ' 🤖' : ''}</li>`).join('');
    show('#botRow', isHost);
    $('#lobbyHint').textContent = isHost ? '👑 คุณเป็นเจ้าของห้อง ห้ามปิดหน้านี้ระหว่างเล่น · อยู่คนเดียวก็เพิ่มบอทมาแข่งได้' : 'รอทุกคนพร้อม แล้วใครกดเริ่มก็ได้!';
  }
  if (st === 'countdown' || st === 'question' || st === 'reveal') {
    const sorted = standings(), myRank = sorted.findIndex(p => p.id === myId) + 1;
    $('#rank').innerHTML = ord(myRank);
    $('#roundInfo').textContent = st === 'countdown' ? 'เตรียมตัว!' : `ข้อที่ ${S.round}`;
    $('#board').innerHTML = sorted.map(p => `<li class="${p.id === myId ? 'me' : ''}">${ava(p.look)}${esc(p.name)}${st === 'question' && p.answered ? ' <span class="ok">✓</span>' : ''}<span class="pts">${Math.min(p.points, GOAL)}</span></li>`).join('');
    $('#dots').innerHTML = S.players.map(p => `<div data-id="${p.id}" class="${p.id === myId ? 'me' : ''}" style="background:${LOOKS[p.look].shirt}"></div>`).join('');
  }
  if (st === 'question' || st === 'reveal') renderQuestion();
  if (st === 'reveal' && S.results) {
    $('#roundResult').innerHTML = `<h4>ผลข้อที่ ${S.round} · ตอบ ${S.q.answer}</h4>` + S.results.map(x => {
      const p = S.players.find(q => q.id === x.id); if (!p) return '';
      return `<div><span>${x.correct ? medal(x.rank - 1) : (x.choice == null ? '⌛' : '❌')}</span><span>${esc(p.name)}</span><span>${x.correct ? (x.time / 1000).toFixed(2) + 'วิ' : ''}</span><span>+${x.gain}</span></div>`;
    }).join('');
  }
  if (st === 'finished' && S.final) {
    $('#podium').innerHTML = S.final.map((p, i) => `<div class="r ${p.id === myId ? 'me' : ''}"><span class="m">${medal(i)}</span>${ava(p.look)}
      <div><div class="n">${esc(p.name)}</div><div class="d">ตอบถูก ${p.correct}/${S.round} ข้อ${p.correct ? ` · เฉลี่ย ${(p.ctime / p.correct / 1000).toFixed(2)} วิ` : ''}</div></div>
      <span class="p">${p.points >= GOAL ? '🏁' : Math.round(Math.min(p.points, GOAL)) + '%'}</span></div>`).join('');
  }
}

let renderedQid = null;
function renderQuestion() {
  const q = S.q; if (!q) return;
  if (renderedQid !== q.id) {
    renderedQid = q.id;
    $('#qtext').textContent = `${q.text} = ?`;
    $('#choices').innerHTML = q.choices.map((c, i) => `<button class="ch ch${i}" data-i="${i}"><small>${i + 1}</small>${c}</button>`).join('');
  }
  const btns = [...document.querySelectorAll('.ch')];
  const me = S.players.find(p => p.id === myId);
  if (S.state === 'question') {
    btns.forEach((b, i) => { b.disabled = !!myAnswer; b.classList.toggle('picked', !!myAnswer && myAnswer.idx === i); b.classList.remove('right', 'wrong'); });
    const n = S.players.filter(p => p.answered).length;
    $('#qmsg').innerHTML = myAnswer ? `ส่งคำตอบแล้ว! รอคนอื่น… (${n}/${S.players.length})` : 'เลือกคำตอบให้ไวที่สุด! <span class="small">(คีย์บอร์ด 1-4)</span>';
  } else {
    const r = S.results && S.results.find(x => x.id === myId);
    btns.forEach(b => {
      const val = q.choices[+b.dataset.i];
      b.disabled = true; b.classList.toggle('right', val === q.answer);
      b.classList.toggle('wrong', !!r && r.choice === val && val !== q.answer);
    });
    $('#qmsg').innerHTML = !r ? '' : r.correct
      ? `✅ ถูกต้อง! อันดับ ${r.rank} ของข้อนี้ · ${(r.time / 1000).toFixed(2)} วิ · <b style="color:#16a34a">วิ่ง +${r.gain}</b>`
      : r.choice == null ? '⌛ หมดเวลา! รอบนี้ไม่ได้วิ่ง' : `❌ ผิด! คำตอบคือ ${q.answer} · รอบนี้ไม่ได้วิ่ง`;
  }
}

/* ======================================================================
   นักวิ่งในฉาก + กล้อง
   ====================================================================== */
const runners = new Map(); // id -> runner
let demo = [];
function syncRunners(list) {
  const ids = new Set(list.map(p => p.id));
  for (const [id, r] of runners) if (!ids.has(id)) { removeRunner(r); runners.delete(id); }
  for (const p of list) {
    let r = runners.get(p.id);
    if (r && (r.look !== p.look || r.name !== p.name)) { removeRunner(r); runners.delete(p.id); r = null; }
    if (!r) { r = makeRunner(p.look, p.name, p.id === myId); runners.set(p.id, r); }
    r.lane = p.lane; r.target = Math.min(p.points, GOAL) / GOAL;
    if (r.target < r.u - 0.001) r.u = r.target; // รีเซ็ตเกม
  }
  const inGame = list.length > 0;
  demo.forEach(d => d.root.visible = !inGame);
}
function buildDemo() {
  demo = LOOKS.map((_, i) => { const r = makeRunner(i, null, false); r.lane = i + 1; r.u = Math.random() * 0.2; r.v = 0.022 + Math.random() * 0.008; return r; });
}
function showcaseLook(i) { demo.forEach((d, k) => d.root.scale.setScalar(k === i ? 1.25 : 0.95)); }

const camPos = new THREE.Vector3(80, 40, 80), camLook = new THREE.Vector3(), tmpV = new THREE.Vector3(), tmpL = new THREE.Vector3();
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  const inRoom = !!(S && S.players.some(p => p.id === myId));
  const st = inRoom ? S.state : null;

  // ขยับนักวิ่ง
  if (!inRoom) {
    for (const d of demo) {
      const P = 2 * L + 2 * Math.PI * laneR(d.lane);
      d.v += (Math.random() - .5) * 0.002; d.v = Math.min(0.034, Math.max(0.02, d.v));
      d.u += d.v * dt; d.speed = d.v * P; poseRunner(d, d.lane, dt, t, false);
    }
  } else {
    for (const [id, r] of runners) {
      const P = 2 * L + 2 * Math.PI * laneR(r.lane), gap = r.target - r.u;
      const vel = gap > 0.0005 ? Math.min(0.07, Math.max(0.012, gap * 1.4)) : 0;
      const du = Math.min(gap > 0 ? gap : 0, vel * dt);
      r.u += du; r.speed = du / dt * P;
      poseRunner(r, r.lane, dt, t, r.target >= 1 && r.u >= 0.999);
    }
  }

  // กล้อง
  if (!inRoom) {
    const a = t * 0.06;
    tmpV.set(Math.cos(a) * 105, 42, Math.sin(a) * 85); tmpL.set(0, 0, 0);
  } else if (st === 'lobby') {
    const zm = (RIN + ROUT) / 2;
    tmpV.set(10 + Math.sin(t * 0.3) * 1.5, 3.2, zm + Math.sin(t * 0.2) * 2); tmpL.set(0, 1.6, zm);
  } else {
    const me = runners.get(myId) || [...runners.values()][0];
    if (me) {
      const rr = laneR(me.lane), [x, z] = posAt(me.u, rr), [x2, z2] = posAt(me.u + 0.01, rr);
      const dx = x2 - x, dz = z2 - z, len = Math.hypot(dx, dz) || 1, fx = dx / len, fz = dz / len;
      if (st === 'finished') { const a = t * 0.4; tmpV.set(x + Math.cos(a) * 9, 4, z + Math.sin(a) * 9); tmpL.set(x, 1.8, z); }
      else { tmpV.set(x - fx * 7.5 + fz * 1.2, 3.6, z - fz * 7.5 - fx * 1.2); tmpL.set(x + fx * 6, 1.4, z + fz * 6); }
    }
  }
  const k = 1 - Math.exp(-dt * (inRoom ? 4 : 1.5));
  camPos.lerp(tmpV, k); camLook.lerp(tmpL, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  sun.target.position.copy(camLook); sun.position.copy(camLook).add(SUN_OFF);

  // ของประดับเคลื่อนไหว
  if (world.crowd) {
    const m = new THREE.Matrix4();
    world.seats.forEach(([x, y, z, ph], i) => { m.makeTranslation(x, y + Math.max(0, Math.sin(t * 5 + ph)) * 0.35, z); world.crowd.setMatrixAt(i, m); });
    world.crowd.instanceMatrix.needsUpdate = true;
    world.flags.forEach((f, i) => { f.rotation.y = Math.sin(t * 2 + i) * 0.4; });
    world.clouds.forEach((c, i) => { c.position.x += dt * (1 + i % 3); if (c.position.x > 320) c.position.x = -320; });
  }

  // UI ที่ต้องอัปเดตทุกเฟรม
  if (inRoom) {
    const left = S.endsAt - hostNow();
    if (st === 'question') { $('#timerFill').style.width = Math.max(0, left / Q_TIME * 100) + '%'; $('#timerFill').style.backgroundPosition = `${-(1 - left / Q_TIME) * 400}px 0`; }
    let big = '';
    if (st === 'countdown') big = left > 200 ? Math.ceil((left - 200) / 1000) : 'GO!';
    else if (st === 'question' && S.round === 1 && Q_TIME - left < 700) big = 'GO!';
    $('#big').textContent = big;
    for (const el of document.querySelectorAll('#dots div')) { const r = runners.get(el.dataset.id); if (r) el.style.left = (r.u * 100) + '%'; }
  } else $('#big').textContent = '';

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

// เริ่ม (รอฟอนต์ไม่เกิน 1.5 วิ เพื่อให้ป้ายในสนามใช้ฟอนต์สวย)
await Promise.race([document.fonts.load('italic 900 40px Kanit'), new Promise(r => setTimeout(r, 1500))]).catch(() => {});
resize(); buildWorld(); buildDemo(); showcaseLook(myLook); frame();
if (typeof Peer === 'undefined') status('โหลดระบบเชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรช');
</script>
